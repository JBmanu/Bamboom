# frontend/web-app/nginx.conf
#
# Configurazione Nginx per servire la Single Page Application Vue.

server {
    listen 80;
    server_name _;

    # Cartella dove stanno i file statici compilati
    root /usr/share/nginx/html;
    index index.html;

    # ── ROUTING SPA (il punto chiave) ──
    # Quando l'utente visita /lobby o /decks e ricarica la pagina,
    # quei path NON sono file reali sul disco — sono rotte gestite
    # da Vue Router lato browser.
    #
    # try_files dice a Nginx:
    #   1. prova a servire il file richiesto ($uri)
    #   2. prova come cartella ($uri/)
    #   3. se non esiste, servi index.html (fallback)
    #
    # Così Vue Router può gestire la rotta lato client invece
    # di ricevere un 404 da Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache degli asset statici ──
    # JS, CSS, immagini hanno hash nel nome (index-BnygKa8K.js)
    # quindi possono essere cachati a lungo: se cambiano,
    # cambia l'hash e il browser scarica la nuova versione.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}