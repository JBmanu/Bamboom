# .github/workflows/_release-api-gateway.yml
#
# Build & push dell'immagine Docker di api-gateway su ghcr.io.
# Si attiva SOLO quando release-please crea il tag api-gateway-v*
# (cioè dopo che hai mergiato la sua Release PR).

name: Release api-gateway

on:
  push:
    tags:
      - 'api-gateway-v*'

permissions:
  contents: read
  packages: write    # necessario per pubblicare su ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Estrae la versione dal nome del tag (es. "api-gateway-v0.1.0" → "0.1.0")
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#api-gateway-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Builda l'immagine con il tag Gradle (task riusato da Trivy)
      - name: Build image with version tag
        run: ./gradlew :api-gateway:dockerBuild -PimageVersion=${{ steps.version.outputs.version }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag api-gateway:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/api-gateway:${{ steps.version.outputs.version }}
          docker tag api-gateway:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/api-gateway:latest
          docker push ghcr.io/$OWNER_LC/api-gateway:${{ steps.version.outputs.version }}
          docker push ghcr.io/$OWNER_LC/api-gateway:latest