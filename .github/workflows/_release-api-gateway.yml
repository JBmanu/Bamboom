# .github/workflows/_release-api-gateway.yml
#
# Build & push dell'immagine Docker di api-gateway su ghcr.io.
# Si attiva SOLO quando release-please crea il tag api-gateway-v*
# (cioè dopo che hai mergiato la sua Release PR).

name: Release api-gateway

on:
  push:
    tags:
      - 'api-gateway-v*'

permissions:
  contents: read
  packages: write    # necessario per pubblicare su ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Estrae la versione dal nome del tag (es. "api-gateway-v0.1.0" → "0.1.0")
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#api-gateway-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Login al registry con le credenziali automatiche del workflow
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Costruisce l'immagine e la pubblica con DUE tag:
      # uno con la versione esatta, uno "latest" per comodità
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api-gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/api-gateway:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/api-gateway:latest