on:
  workflow_call:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build Kotlin modules manually
        working-directory: micro-services/progress
        run: |
          chmod +x gradlew
          ./gradlew :app:compileKotlin :player-progress:compileKotlin --no-daemon --max-workers=1
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"