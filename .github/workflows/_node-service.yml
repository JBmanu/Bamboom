name: node-service

on:
  workflow_call:
    inputs:
      name:
        description: Service name, used for the image, the tag prefix and the CodeQL category (card-forge, player-frontend, ...)
        type: string
        required: true
      path:
        description: Service folder (micro-services/card-forge, ...)
        type: string
        required: true
      project:
        description: Gradle project, only when it differs from name (the player frontend is "player")
        type: string
        default: ''
      lockfile:
        description: Lockfile used as the npm cache key, only when it is not <path>/package-lock.json (the frontend apps share frontend/package-lock.json)
        type: string
        default: ''
      has-image:
        description: Whether the service ships a Docker image (build + Trivy scan). False for libraries such as frontend/common.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify-node
        with:
          project: ${{ inputs.project || inputs.name }}
          path: ${{ inputs.path }}
          image: ${{ inputs.name }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          lockfile: ${{ inputs.lockfile }}
          build-image: ${{ inputs.has-image }}

  codeql:
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/codeql-js-ts
        with:
          name: ${{ inputs.name }}
          path: ${{ inputs.path }}

  release-image:
    if: ${{ inputs.has-image && github.ref_type == 'tag' && startsWith(github.ref_name, format('{0}-v', inputs.name)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure the tagged commit is on main
        run: |
          # Fails when the tag points to a commit that never reached main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points to a commit that is not on main."
            exit 1
          fi
      - uses: ./.github/actions/release-image
        with:
          project: ${{ inputs.project || inputs.name }}
          image: ${{ inputs.name }}