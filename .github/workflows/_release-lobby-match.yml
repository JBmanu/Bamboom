name: Release lobby-match

on:
  push:
    tags:
      - 'lobby-match-v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#lobby-match-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build image with version tag
        run: ./gradlew :lobby-match:dockerBuild -PimageVersion=${{ steps.version.outputs.version }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag lobby-match:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/lobby-match:${{ steps.version.outputs.version }}
          docker tag lobby-match:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/lobby-match:latest
          docker push ghcr.io/$OWNER_LC/lobby-match:${{ steps.version.outputs.version }}
          docker push ghcr.io/$OWNER_LC/lobby-match:latest