name: player-frontend

on:
  workflow_call:
  push:
    tags:
      - 'player-frontend-v*'

permissions:
  contents: read
  packages: write

jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "player-frontend è cambiato"
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/player/package-lock.json

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (ESLint + Prettier)
        run: ./gradlew :player:lint

      - name: Type-check (vue-tsc)
        run: ./gradlew :player:type-check

      - name: Test (Vitest)
        run: ./gradlew :player:test

      - name: Build (vue-tsc + vite)
        run: ./gradlew :player:build

      - name: Build Docker image
        run: ./gradlew :player:dockerBuild

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: player-frontend:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/player/coverage/lcov.info
          flags: player-frontend
          fail_ci_if_error: false

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/player-frontend-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#player-frontend-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build image with version tag
        run: ./gradlew :player:dockerBuild -PimageVersion=${{ steps.version.outputs.version }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag player-frontend:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/player-frontend:${{ steps.version.outputs.version }}
          docker tag player-frontend:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/player-frontend:latest
          docker push ghcr.io/$OWNER_LC/player-frontend:${{ steps.version.outputs.version }}
          docker push ghcr.io/$OWNER_LC/player-frontend:latest
