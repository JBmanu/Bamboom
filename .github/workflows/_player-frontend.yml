on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "player-frontend è cambiato"
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/player/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (ESLint + Prettier)
        run: ./gradlew :player:lint

      - name: Type-check (vue-tsc)
        run: ./gradlew :player:type-check

      - name: Test (Vitest)
        run: ./gradlew :player:test

      - name: Build (vue-tsc + vite)
        run: ./gradlew :player:build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/player/coverage/lcov.info
          flags: player-frontend
          fail_ci_if_error: false