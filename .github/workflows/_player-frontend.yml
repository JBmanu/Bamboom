on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "player-frontend è cambiato"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/player/package-lock.json

      - name: Install dependencies
        working-directory: frontend/player
        run: npm ci

      - name: Lint (ESLint + Prettier)
        working-directory: frontend/player
        run: npm run lint

      - name: Type-check (vue-tsc)
        working-directory: frontend/player
        run: npm run type-check

      - name: Test (Vitest)
        working-directory: frontend/player
        run: npm test

      - name: Build (vue-tsc + vite)
        working-directory: frontend/player
        run: npm run build