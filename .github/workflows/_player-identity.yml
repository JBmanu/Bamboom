on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "player-identity è cambiato"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: micro-services/player-identity/package-lock.json

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (Biome)
        run: ./gradlew :player-identity:lint

      - name: Type-check (tsc)
        run: ./gradlew :player-identity:type-check

      - name: Test (Jest)
        run: ./gradlew :player-identity:test

      - name: Build (tsc)
        run: ./gradlew :player-identity:build

      - name: Build Docker image
        run: docker build -t player-identity:scan -f micro-services/player-identity/Dockerfile .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: player-identity:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/player-identity/coverage/lcov.info
          flags: player-identity
          fail_ci_if_error: false
