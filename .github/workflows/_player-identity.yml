on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "player-identity è cambiato"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: micro-services/player-identity/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (Biome)
        run: ./gradlew :player-identity:lint

      - name: Type-check (tsc)
        run: ./gradlew :player-identity:type-check

      - name: Test (Jest)
        run: ./gradlew :player-identity:test

      - name: Build (tsc)
        run: ./gradlew :player-identity:build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/player-identity/coverage/lcov.info
          flags: player-identity
          fail_ci_if_error: false
