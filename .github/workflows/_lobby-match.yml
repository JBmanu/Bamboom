on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "lobby-match è cambiato"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: micro-services/lobby-match/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (Biome)
        run: ./gradlew :lobby-match:lint

      - name: Type-check (tsc)
        run: ./gradlew :lobby-match:type-check

      - name: Test (Jest)
        run: ./gradlew :lobby-match:test

      - name: Build (tsc)
        run: ./gradlew :lobby-match:build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/lobby-match/coverage/lcov.info
          flags: lobby-match
          fail_ci_if_error: false
