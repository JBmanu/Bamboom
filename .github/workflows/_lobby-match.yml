# .github/workflows/_lobby-match.yml
#
# Workflow riutilizzabile per lobby-match.
# Chiamato da ci.yml quando lobby-match cambia.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "lobby-match è cambiato"
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: micro-services/lobby-match/package-lock.json

      - name: Install dependencies
        working-directory: micro-services/lobby-match
        run: npm ci

      - name: Lint (Biome)
        working-directory: micro-services/lobby-match
        run: npm run lint