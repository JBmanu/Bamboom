name: deck-workshop

on:
  workflow_call:
  push:
    tags:
      - 'deck-workshop-v*'

permissions:
  contents: read
  packages: write

jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "deck-workshop è cambiato"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: micro-services/deck-workshop/package-lock.json

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (Biome)
        run: ./gradlew :deck-workshop:lint

      - name: Type-check (tsc)
        run: ./gradlew :deck-workshop:type-check

      - name: Test (Jest)
        run: ./gradlew :deck-workshop:test

      - name: Build (tsc)
        run: ./gradlew :deck-workshop:build

      - name: Build Docker image
        run: ./gradlew :deck-workshop:dockerBuild

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deck-workshop:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/deck-workshop/coverage/lcov.info
          flags: deck-workshop
          fail_ci_if_error: false

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/deck-workshop-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#deck-workshop-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build image with version tag
        run: ./gradlew :deck-workshop:dockerBuild -PimageVersion=${{ steps.version.outputs.version }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag deck-workshop:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/deck-workshop:${{ steps.version.outputs.version }}
          docker tag deck-workshop:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/deck-workshop:latest
          docker push ghcr.io/$OWNER_LC/deck-workshop:${{ steps.version.outputs.version }}
          docker push ghcr.io/$OWNER_LC/deck-workshop:latest
