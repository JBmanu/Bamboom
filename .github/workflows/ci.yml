name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  actions: read
  packages: write
  security-events: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      common-frontend: ${{ steps.filter.outputs.common-frontend }}
      player-frontend: ${{ steps.filter.outputs.player-frontend }}
      admin-frontend:  ${{ steps.filter.outputs.admin-frontend }}
      api-gateway:     ${{ steps.filter.outputs.api-gateway }}
      player-identity: ${{ steps.filter.outputs.player-identity }}
      lobby-match:     ${{ steps.filter.outputs.lobby-match }}
      deck-workshop:   ${{ steps.filter.outputs.deck-workshop }}
      card-forge:      ${{ steps.filter.outputs.card-forge }}
      progress:        ${{ steps.filter.outputs.progress }}
      codeql-actions:  ${{ steps.filter.outputs.codeql-actions }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'build-logic/**'
              - '.github/actions/**'  
            frontend-shared: &frontend-shared
              - 'frontend/*'
            common-frontend:
              - *shared
              - *frontend-shared
              - '.github/workflows/_node-service.yml'
              - 'frontend/common/**'
            player-frontend:
              - *shared
              - *frontend-shared
              - '.github/workflows/_node-service.yml'
              - 'frontend/common/**'
              - 'frontend/player/**'
            admin-frontend:
              - *shared
              - *frontend-shared
              - '.github/workflows/_node-service.yml'
              - 'frontend/common/**'
              - 'frontend/admin/**'
            api-gateway:
              - *shared
              - '.github/workflows/_node-service.yml'
              - 'api-gateway/**'
            player-identity:
              - *shared
              - '.github/workflows/_node-service.yml'
              - 'micro-services/player-identity/**'
            lobby-match:
              - *shared
              - '.github/workflows/_node-service.yml'
              - 'micro-services/lobby-match/**'
            deck-workshop:
              - *shared
              - '.github/workflows/_node-service.yml'
              - 'micro-services/deck-workshop/**'
            card-forge:
              - *shared
              - '.github/workflows/_node-service.yml'
              - 'micro-services/card-forge/**'
            progress:
              - *shared
              - '.github/workflows/svc-progress.yml'
              - 'micro-services/progress/**'
              - 'gradle/libs.versions.toml'
            codeql-actions:
              - '.github/**'

  common-frontend:
    needs: changes
    if: needs.changes.outputs.common-frontend == 'true'
    uses: ./.github/workflows/_node-service.yml
    with:
      name: common
      path: frontend/common
      project: common
      lockfile: frontend/package-lock.json
      has-image: false
    secrets: inherit

  player-frontend:
    needs: changes
    if: needs.changes.outputs.player-frontend == 'true'
    uses: ./.github/workflows/_node-service.yml
    with:
      name: player-frontend
      path: frontend/player
      project: player
      lockfile: frontend/package-lock.json
    secrets: inherit

  admin-frontend:
    needs: changes
    if: needs.changes.outputs.admin-frontend == 'true'
    uses: ./.github/workflows/_node-service.yml
    with:
      name: admin-frontend
      path: frontend/admin
      project: admin
      lockfile: frontend/package-lock.json
    secrets: inherit

  api-gateway:
    needs: changes
    if: needs.changes.outputs.api-gateway == 'true'
    uses: ./.github/workflows/_node-service.yml
    with:
      name: api-gateway
      path: api-gateway
    secrets: inherit

  player-identity:
    needs: changes
    if: needs.changes.outputs.player-identity == 'true'
    uses: ./.github/workflows/_node-service.yml
    with:
      name: player-identity
      path: micro-services/player-identity
    secrets: inherit

  lobby-match:
    needs: changes
    if: needs.changes.outputs.lobby-match == 'true'
    uses: ./.github/workflows/_node-service.yml
    with:
      name: lobby-match
      path: micro-services/lobby-match
    secrets: inherit

  deck-workshop:
    needs: changes
    if: needs.changes.outputs.deck-workshop == 'true'
    uses: ./.github/workflows/_node-service.yml
    with:
      name: deck-workshop
      path: micro-services/deck-workshop
    secrets: inherit

  card-forge:
    needs: changes
    if: needs.changes.outputs.card-forge == 'true'
    uses: ./.github/workflows/_node-service.yml
    with:
      name: card-forge
      path: micro-services/card-forge
    secrets: inherit

  progress:
    needs: changes
    if: needs.changes.outputs.progress == 'true'
    uses: ./.github/workflows/svc-progress.yml

  codeql-actions:
    needs: changes
    if: needs.changes.outputs.codeql-actions == 'true'
    uses: ./.github/workflows/codeql.yml
    with:
      actions: true

  gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - api-gateway
      - player-identity
      - lobby-match
      - deck-workshop
      - card-forge
      - common-frontend
      - player-frontend
      - admin-frontend
      - progress
      - codeql-actions
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Almeno un job è fallito"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ Almeno un job è stato cancellato"
            exit 1
          fi
          echo "✅ Tutti i job eseguiti sono passati (gli altri sono stati saltati)"