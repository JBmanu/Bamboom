name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read
  packages: write
  security-events: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      player-frontend: ${{ steps.filter.outputs.player-frontend }}
      admin-frontend:  ${{ steps.filter.outputs.admin-frontend }}
      api-gateway:     ${{ steps.filter.outputs.api-gateway }}
      player-identity: ${{ steps.filter.outputs.player-identity }}
      lobby-match:     ${{ steps.filter.outputs.lobby-match }}
      deck-workshop:   ${{ steps.filter.outputs.deck-workshop }}
      card-forge:      ${{ steps.filter.outputs.card-forge }}
      progress:        ${{ steps.filter.outputs.progress }}
      codeql-actions:  ${{ steps.filter.outputs.codeql-actions }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'build-logic/**'
              - '.github/actions/**'
            player-frontend:
              - *shared
              - '.github/workflows/svc-player-frontend.yml'
              - 'frontend/player/**'
              - 'frontend/.prettierrc.json'
            admin-frontend:
              - *shared
              - 'frontend/admin/**'
              - 'frontend/.prettierrc.json'
            api-gateway:
              - *shared
              - '.github/workflows/svc-api-gateway.yml'
              - 'api-gateway/**'
            player-identity:
              - *shared
              - '.github/workflows/svc-player-identity.yml'
              - 'micro-services/player-identity/**'
            lobby-match:
              - *shared
              - '.github/workflows/svc-lobby-match.yml'
              - 'micro-services/lobby-match/**'
            deck-workshop:
              - *shared
              - '.github/workflows/svc-deck-workshop.yml'
              - 'micro-services/deck-workshop/**'
            card-forge:
              - *shared
              - .github/workflows/_node-service.yml
              - '.github/workflows/svc-card-forge.yml'
              - 'micro-services/card-forge/**'
            progress:
              - *shared
              - '.github/workflows/svc-progress.yml'
              - 'micro-services/progress/**'
              - 'gradle/libs.versions.toml'
            codeql-actions:
              - '.github/**'

  player-frontend:
    needs: changes
    if: needs.changes.outputs.player-frontend == 'true'
    uses: ./.github/workflows/svc-player-frontend.yml

  admin-frontend:
    needs: changes
    if: needs.changes.outputs.admin-frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "admin frontend è cambiato — qui gireranno lint, test, build"

  api-gateway:
    needs: changes
    if: needs.changes.outputs.api-gateway == 'true'
    uses: ./.github/workflows/svc-api-gateway.yml

  player-identity:
    needs: changes
    if: needs.changes.outputs.player-identity == 'true'
    uses: ./.github/workflows/svc-player-identity.yml

  lobby-match:
    needs: changes
    if: needs.changes.outputs.lobby-match == 'true'
    uses: ./.github/workflows/svc-lobby-match.yml

  deck-workshop:
    needs: changes
    if: needs.changes.outputs.deck-workshop == 'true'
    uses: ./.github/workflows/svc-deck-workshop.yml

  card-forge:
    needs: changes
    if: needs.changes.outputs.card-forge == 'true'
    uses: ./.github/workflows/_node-service.yml
    with:
      name: card-forge
      path: micro-services/card-forge
    secrets: inherit

  progress:
    needs: changes
    if: needs.changes.outputs.progress == 'true'
    uses: ./.github/workflows/svc-progress.yml

  codeql-actions:
    needs: changes
    if: needs.changes.outputs.codeql-actions == 'true'
    uses: ./.github/workflows/codeql.yml
    with:
      actions: true

  gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - api-gateway
      - player-identity
      - lobby-match
      - deck-workshop
      - card-forge
      - player-frontend
      - admin-frontend
      - progress
      - codeql-actions
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Almeno un job è fallito"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ Almeno un job è stato cancellato"
            exit 1
          fi
          echo "✅ Tutti i job eseguiti sono passati (gli altri sono stati saltati)"