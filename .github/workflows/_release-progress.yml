name: Release progress

on:
  push:
    tags:
      - 'progress-v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#progress-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # JDK 25 richiesto dal composite build per costruire il fat JAR
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build image with version tag
        run: ./gradlew :progress:dockerBuild -PimageVersion=${{ steps.version.outputs.version }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag progress:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/progress:${{ steps.version.outputs.version }}
          docker tag progress:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/progress:latest
          docker push ghcr.io/$OWNER_LC/progress:${{ steps.version.outputs.version }}
          docker push ghcr.io/$OWNER_LC/progress:latest