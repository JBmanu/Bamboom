name: card-forge

on:
  workflow_call:
  push:
    tags:
      - 'card-forge-v*'

permissions:
  contents: read
  packages: write

jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify-node
        with:
          project: card-forge
          path: micro-services/card-forge
          image: card-forge
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/card-forge-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#card-forge-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build image with version tag
        run: ./gradlew :card-forge:dockerBuild -PimageVersion=${{ steps.version.outputs.version }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag card-forge:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/card-forge:${{ steps.version.outputs.version }}
          docker tag card-forge:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/card-forge:latest
          docker push ghcr.io/$OWNER_LC/card-forge:${{ steps.version.outputs.version }}
          docker push ghcr.io/$OWNER_LC/card-forge:latest