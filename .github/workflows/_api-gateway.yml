on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "api-gateway è cambiato"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api-gateway/package-lock.json

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (Biome)
        run: ./gradlew :api-gateway:lint

      - name: Type-check (tsc)
        run: ./gradlew :api-gateway:type-check

      - name: Test (Jest)
        run: ./gradlew :api-gateway:test

      - name: Build (tsc)
        run: ./gradlew :api-gateway:build

      - name: Build Docker image
        run: ./gradlew :api-gateway:dockerBuild

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: api-gateway:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: api-gateway/coverage/lcov.info
          flags: api-gateway
          fail_ci_if_error: false
