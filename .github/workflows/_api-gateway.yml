name: api-gateway

on:
  workflow_call:
  push:
    tags:
      - 'api-gateway-v*'

permissions:
  contents: read
  packages: write

jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "api-gateway è cambiato"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api-gateway/package-lock.json

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (Biome)
        run: ./gradlew :api-gateway:lint

      - name: Type-check (tsc)
        run: ./gradlew :api-gateway:type-check

      - name: Test (Jest)
        run: ./gradlew :api-gateway:test

      - name: Build (tsc)
        run: ./gradlew :api-gateway:build

      - name: Build Docker image
        run: ./gradlew :api-gateway:dockerBuild

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: api-gateway:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: api-gateway/coverage/lcov.info
          flags: api-gateway
          fail_ci_if_error: false

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/api-gateway-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Estrae la versione dal nome del tag (es. "api-gateway-v0.1.0" → "0.1.0")
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#api-gateway-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Builda l'immagine con il tag Gradle (task riusato da Trivy)
      - name: Build image with version tag
        run: ./gradlew :api-gateway:dockerBuild -PimageVersion=${{ steps.version.outputs.version }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag api-gateway:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/api-gateway:${{ steps.version.outputs.version }}
          docker tag api-gateway:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/api-gateway:latest
          docker push ghcr.io/$OWNER_LC/api-gateway:${{ steps.version.outputs.version }}
          docker push ghcr.io/$OWNER_LC/api-gateway:latest
