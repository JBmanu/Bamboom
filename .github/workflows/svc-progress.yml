name: progress

on:
  workflow_call:
  push:
    tags:
      - 'progress-v*'

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.ref_type != 'tag'}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jvm
      - name: Make gradlew executable
        working-directory: micro-services/progress
        run: chmod +x gradlew

      - name: Lint (detekt + Spotless + Scalafix + WartRemover)
        run: ./gradlew :progress:lint

      - name: Test
        run: ./gradlew :progress:test

      - name: Build (fat JAR)
        run: ./gradlew :progress:shadowJar

      - name: Build Docker image
        run: ./gradlew :progress:dockerBuild

      - uses: ./.github/actions/trivy-scan
        with:
          image: progress:latest

      - uses: ./.github/actions/upload-coverage
        with:
          files: progress-app
          flags: micro-services/progress/app/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - uses: ./.github/actions/upload-coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/progress/player-progress/build/reports/jacoco/test/jacocoTestReport.xml
          flags: progress-player-progress

      - uses: ./.github/actions/upload-coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/progress/game-observatory/build/reports/jacoco/test/jacocoTestReport.xml
          flags: progress-game-observatory

  release:
    if: ${{ github.ref_type == 'tag'}}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-image
        with:
          project: progress
          image: progress
