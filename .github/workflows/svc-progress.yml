name: progress

on:
  workflow_call:
  push:
    tags:
      - 'progress-v*'

permissions:
  contents: read
  packages: write

jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jvm
      - name: Make gradlew executable
        working-directory: micro-services/progress
        run: chmod +x gradlew

      - name: Lint (detekt + Spotless + Scalafix + WartRemover)
        run: ./gradlew :progress:lint

      - name: Test
        run: ./gradlew :progress:test

      - name: Build (fat JAR)
        run: ./gradlew :progress:shadowJar

      - name: Build Docker image
        run: ./gradlew :progress:dockerBuild

      - uses: ./.github/actions/trivy-scan
        with:
          image: progress:latest

      - name: Upload coverage — app (Kotlin)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/progress/app/build/reports/jacoco/test/jacocoTestReport.xml
          flags: progress-app
          fail_ci_if_error: false

      - name: Upload coverage — player-progress (Kotlin BC)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/progress/player-progress/build/reports/jacoco/test/jacocoTestReport.xml
          flags: progress-player-progress
          fail_ci_if_error: false

      - name: Upload coverage — game-observatory (Scala BC)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/progress/game-observatory/build/reports/jacoco/test/jacocoTestReport.xml
          flags: progress-game-observatory
          fail_ci_if_error: false

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/progress-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#progress-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build image with version tag
        run: ./gradlew :progress:dockerBuild -PimageVersion=${{ steps.version.outputs.version }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag progress:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/progress:${{ steps.version.outputs.version }}
          docker tag progress:${{ steps.version.outputs.version }} ghcr.io/$OWNER_LC/progress:latest
          docker push ghcr.io/$OWNER_LC/progress:${{ steps.version.outputs.version }}
          docker push ghcr.io/$OWNER_LC/progress:latest
