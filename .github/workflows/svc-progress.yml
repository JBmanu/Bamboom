name: progress

on:
  workflow_call:
  push:
    tags:
      - 'progress-v*'

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.ref_type != 'tag'}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jvm
      - name: Make gradlew executable
        working-directory: micro-services/progress
        run: chmod +x gradlew

      - name: Lint (detekt + Spotless + Scalafix + WartRemover)
        run: ./gradlew :progress:lint

      - name: Test
        run: ./gradlew :progress:test

      - name: Build (fat JAR)
        run: ./gradlew :progress:shadowJar

      - name: Build Docker image
        run: ./gradlew :progress:dockerBuild

      - uses: ./.github/actions/trivy-scan
        with:
          image: progress:latest

      - uses: ./.github/actions/upload-coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: micro-services/progress/app/build/reports/jacoco/test/jacocoTestReport.xml
          files: progress-app

      - uses: ./.github/actions/upload-coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/progress/player-progress/build/reports/jacoco/test/jacocoTestReport.xml
          flags: progress-player-progress

      - uses: ./.github/actions/upload-coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/progress/game-observatory/build/reports/jacoco/test/jacocoTestReport.xml
          flags: progress-game-observatory

  codeql:
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/codeql-kotlin

  release:
    if: ${{ github.ref_type == 'tag'}}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure the tagged commit is on main
        run: |
          # Fails when the tag points to a commit that never reached main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points to a commit that is not on main."
            exit 1
          fi
      - uses: ./.github/actions/release-image
        with:
          project: progress
          image: progress
