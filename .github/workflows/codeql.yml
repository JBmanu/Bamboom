name: CodeQL

on:
  workflow_call:
    inputs:
      js-ts:
        type: boolean
        default: false
      kotlin:
        type: boolean
        default: false
  schedule:
    - cron: '26 19 * * 3'

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  js-ts:
    if: ${{ github.event_name == 'schedule' || inputs.js-ts }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ javascript-typescript, actions ]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"


  kotlin:
    if: ${{ github.event_name == 'schedule' || inputs.kotlin }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build Kotlin modules manually
        working-directory: micro-services/progress
        run: |
          chmod +x gradlew
          ./gradlew :app:compileKotlin :player-progress:compileKotlin --no-daemon --max-workers=1
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"