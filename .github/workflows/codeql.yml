name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '26 19 * * 3'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # JDK 25 richiesto dal composite build (serve prima dell'init CodeQL
    # solo per il linguaggio java-kotlin, ma il matrix non permette 'if'
    # qui in modo pulito, quindi lo mettiamo condizionale sotto)
    - name: Set up JDK 25
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # Build manuale per Kotlin: il composite build di progress non è
    # rilevabile dall'autobuild di CodeQL. Compiliamo esplicitamente
    # i moduli Kotlin da dentro la cartella progress.
    - name: Build Kotlin modules manually
      if: matrix.language == 'java-kotlin'
      working-directory: micro-services/progress
      run: |
        chmod +x gradlew
        ./gradlew :app:compileKotlin :player-progress:compileKotlin --rerun-tasks --no-daemon --max-workers=1
        
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
