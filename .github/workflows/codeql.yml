name: CodeQL

on:
  workflow_call:
    inputs:
      actions:
        type: boolean
        default: false
  schedule:
    - cron: '26 19 * * 3'
  workflow_dispatch:     # scansione completa a richiesta

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  # Workflow e action in .github/: non appartengono a nessun servizio
  actions:
    if: ${{ inputs.actions || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

  js-ts-full:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  kotlin-full:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/codeql-kotlin