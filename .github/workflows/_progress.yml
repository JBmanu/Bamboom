on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "progress è cambiato"
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: micro-services/progress
        run: chmod +x gradlew

      - name: Lint (detekt + Spotless + Scalafix + WartRemover)
        working-directory: micro-services/progress
        run: ./gradlew lint

      - name: Test
        working-directory: micro-services/progress
        run: ./gradlew test

      - name: Build (shadowJar)
        working-directory: micro-services/progress
        run: ./gradlew :app:shadowJar