on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "progress è cambiato"
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: micro-services/progress
        run: chmod +x gradlew

      - name: Lint (detekt + Spotless + Scalafix + WartRemover)
        run: ./gradlew :progress:lint

      - name: Test
        run: ./gradlew :progress:test

      - name: Build (fat JAR)
        run: ./gradlew :progress:shadowJar

      - name: Build Docker image
        run: docker build -t progress:scan -f micro-services/progress/Dockerfile .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: progress:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Upload coverage — app (Kotlin)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/progress/app/build/reports/jacoco/test/jacocoTestReport.xml
          flags: progress-app
          fail_ci_if_error: false

      - name: Upload coverage — player-progress (Kotlin BC)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/progress/player-progress/build/reports/jacoco/test/jacocoTestReport.xml
          flags: progress-player-progress
          fail_ci_if_error: false

      - name: Upload coverage — game-observatory (Scala BC)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/progress/game-observatory/build/reports/jacoco/test/jacocoTestReport.xml
          flags: progress-game-observatory
          fail_ci_if_error: false