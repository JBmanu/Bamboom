# .github/workflows/_progress.yml
#
# Workflow riutilizzabile per progress (Kotlin + Scala, Gradle).
# Chiamato da ci.yml quando progress (o build-logic / catalog) cambia.
# Esegue detekt (lint) sui moduli Kotlin via ./gradlew lint.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "progress è cambiato"
      - uses: actions/checkout@v4

      # Installa il JDK 25 (Temurin) — la toolchain del progetto usa Java 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Cache delle dipendenze e della build Gradle: velocizza i run
      # successivi riusando artefatti scaricati e output compilati.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Rende eseguibile il wrapper (a volte il flag +x si perde su git)
      - name: Make gradlew executable
        working-directory: micro-services/progress
        run: chmod +x gradlew

      # Esegue detekt su tutti i moduli Kotlin (app + player-progress)
      - name: Lint (detekt)
        working-directory: micro-services/progress
        run: ./gradlew lint