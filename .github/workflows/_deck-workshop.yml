on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "deck-workshop è cambiato"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: micro-services/deck-workshop/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (Biome)
        run: ./gradlew :deck-workshop:lint

      - name: Type-check (tsc)
        run: ./gradlew :deck-workshop:type-check

      - name: Test (Jest)
        run: ./gradlew :deck-workshop:test

      - name: Build (tsc)
        run: ./gradlew :deck-workshop:build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: micro-services/deck-workshop/coverage/lcov.info
          flags: deck-workshop
          fail_ci_if_error: false
