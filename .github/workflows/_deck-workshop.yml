# .github/workflows/_deck-workshop.yml
#
# Workflow riutilizzabile per deck-workshop.
# Chiamato da ci.yml quando deck-workshop cambia.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "deck-workshop è cambiato"
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: micro-services/deck-workshop/package-lock.json

      - name: Install dependencies
        working-directory: micro-services/deck-workshop
        run: npm ci

      - name: Lint (Biome)
        working-directory: micro-services/deck-workshop
        run: npm run lint