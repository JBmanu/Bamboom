name: Verify Node service
description: Lint, type-check, test, build, image scan and coverage for a TS service
inputs:
  project:
    description: Gradle project name (card-forge, player, ...)
    required: true
  path:
    description: Service folder (micro-services/card-forge, ...)
    required: true
  image:
    description: Docker image name (card-forge, player-frontend, ...)
    required: true
  codecov-token:
    description: Passed as input because secrets are not visible inside actions
    required: true
  lockfile:
    description: Lockfile for the npm cache; defaults to <path>/package-lock.json
    required: false
    default: ''
  build-image:
    description: Build and scan the Docker image; set to 'false' for libraries that have none
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: ${{ inputs.lockfile || format('{0}/package-lock.json', inputs.path) }}

    - uses: ./.github/actions/setup-jvm

    - name: Lint
      shell: bash
      env: { PROJECT: "${{ inputs.project }}" }
      run: ./gradlew ":$PROJECT:lint"

    - name: Type-check
      shell: bash
      env: { PROJECT: "${{ inputs.project }}" }
      run: ./gradlew ":$PROJECT:type-check"

    - name: Test
      shell: bash
      env: { PROJECT: "${{ inputs.project }}" }
      run: ./gradlew ":$PROJECT:test"

    - name: Build
      shell: bash
      env: { PROJECT: "${{ inputs.project }}" }
      run: ./gradlew ":$PROJECT:build"

    - name: Build Docker image
      if: inputs.build-image == 'true'
      shell: bash
      env: { PROJECT: "${{ inputs.project }}" }
      run: ./gradlew ":$PROJECT:dockerBuild"

    - if: inputs.build-image == 'true'
      uses: ./.github/actions/trivy-scan
      with:
        image: ${{ inputs.image }}:latest

    - uses: ./.github/actions/upload-coverage
      with:
        token: ${{ inputs.codecov-token }}
        files: ${{ inputs.path }}/coverage/lcov.info
        flags: ${{ inputs.image }}
