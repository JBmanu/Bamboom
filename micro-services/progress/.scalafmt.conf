# micro-services/progress/.scalafmt.conf
# Configurazione scalafmt per il modulo Scala game-observatory.

version = "3.9.6"

# Dialetto Scala 3 (il progetto usa Scala 3.3.6)
runner.dialect = scala3

# Vincoli di stile coerenti col resto del progetto
maxColumn = 180              # riga max 180 (come Biome/detekt)
indent.main = 4              # indentazione 4 spazi

# Stile
align.preset = none          # nessun allineamento forzato (più semplice)
newlines.source = keep       # rispetta le scelte di a-capo dell'autore